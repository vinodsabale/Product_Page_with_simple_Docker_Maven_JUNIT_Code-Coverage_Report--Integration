<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Product</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; }
        .container { max-width: 420px; margin: 50px auto; background: #fff;
                     padding: 30px; border-radius: 8px; box-shadow: 0 0 10px #ddd; }
        h2 { text-align: center; color: #333; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input[type=text], input[type=number], textarea {
            width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;
        }
        button { margin-top: 20px; width: 100%; padding: 10px; background: #007bff;
                 color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        a { display: block; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>
<div class="container">
    <h2>Add New Product</h2>
    <form th:action="@{/products/save}" method="post">
        <label>Product Name</label>
        <input type="text" name="name" required>

        <label>Description</label>
        <textarea name="description" rows="3" required></textarea>

        <label>Price</label>
        <input type="number" step="0.01" name="price" required>

        <label>Quantity</label>
        <input type="number" name="quantity" required>

        <button type="submit">Save Product</button>
    </form>
    <a th:href="@{/products/list}">View All Products</a>
</div>
</body>
</html>
