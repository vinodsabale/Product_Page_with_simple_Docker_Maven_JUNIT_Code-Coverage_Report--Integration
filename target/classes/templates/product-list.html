<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Product List</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; }
        .container { max-width: 900px; margin: 40px auto; }
        table { width: 100%; border-collapse: collapse; background: #fff; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: #007bff; color: #fff; }
        a.btn { display: inline-block; margin-bottom: 15px; padding: 8px 15px;
                background: #28a745; color: #fff; text-decoration: none; border-radius: 4px; }
        a.del { color: #dc3545; text-decoration: none; }
        .server-tag { text-align: center; color: #777; margin-bottom: 10px; font-size: 13px; }
    </style>
</head>
<body>
<div class="container">
    <h2>All Products</h2>
    <p class="server-tag">Served by: <b th:text="${serverHost}"></b></p>
    <a class="btn" th:href="@{/products/add}">+ Add New Product</a>
    <table>
        <tr>
            <th>Name</th><th>Description</th><th>Price</th><th>Quantity</th><th>Action</th>
        </tr>
        <tr th:each="product : ${products}">
            <td th:text="${product.name}"></td>
            <td th:text="${product.description}"></td>
            <td th:text="${product.price}"></td>
            <td th:text="${product.quantity}"></td>
            <td><a class="del" th:href="@{/products/delete/{id}(id=${product.id})}">Delete</a></td>
        </tr>
    </table>
</div>
</body>
</html>
